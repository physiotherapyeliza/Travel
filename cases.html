<title>病例訓練系統</title>
<!--
  使用說明
  1. 這個頁面與 index.html（旅遊手帳）是同一個 repo 裡的獨立頁面，功能互不干擾。
  2. 沿用同一個 Firebase 專案（方便設定），但存在不同的 collection，不會跟旅遊/居家資料混在一起。
  3. 沒網路時自動只用本機儲存，照常可用；有網路時會自動同步，讓不同新進治療師的作答紀錄互通。
  4. 病例採用通用 SOAP 格式（不分骨科/心肺/神經/小兒），一個病例可以由多輪 S/O/A/P 組成
     （例如：初次評估 → 治療測試 → 再評估 → 運動處方 → 複測），輪數不限，每輪內容都是自由文字。
  5. 每位新進治療師都可以自己「＋ 新增病例」練習寫 SOAP，儲存後立即公開在病例庫；是否要附加
     測驗題（選擇題／問答題）給別人作答是自由選擇，不寫也可以存檔。
  6. 「管理後台」用一組簡單的 PIN 碼把關（不是正式帳密系統），PIN 碼可在下面 ADMIN_PIN 直接修改；
     管理者可以編輯/刪除任何人的病例，一般學員只能編輯/刪除自己建立的病例。
-->

<style>
  :root{
    /* 臨床藍綠色系 — 與旅遊(天藍)/居家(綠植)區隔 */
    --paper:#f2f7f6;
    --ink:#2b3a3a;
    --soft:#7c8f8e;
    --line:#dbe8e6;
    --card:#ffffff;
    --card2:#e7f3f1;
    --teal:#2f8f8a;
    --teal-deep:#226b67;
    --teal-soft:#d7ece9;
    --amber:#c98a3a;
    --amber-soft:#f5e6d0;
    --ok:#4f9e6f; --err:#cf6b5b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  header{padding:18px 16px 8px;}
  .htop{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.5px;flex:1;}
  .sync-badge{font-size:12px;padding:4px 10px;border-radius:12px;background:var(--card2);color:var(--soft);white-space:nowrap;}
  .sync-badge.ok{color:var(--ok);} .sync-badge.err{color:var(--err);}
  .sync-badge.loading{color:var(--teal);}
  .whoami{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--soft);}
  .whoami b{color:var(--teal-deep);}
  .switchbtn{border:none;background:none;color:var(--teal);font-size:12px;font-weight:700;cursor:pointer;padding:2px 4px;}

  .tabs{display:flex;gap:6px;padding:10px 16px 4px;flex-wrap:wrap;}
  .tab{flex:1;min-width:72px;text-align:center;padding:9px 0;border:2px solid var(--line);border-radius:16px;
    background:var(--card);color:var(--soft);font-size:13px;font-weight:700;cursor:pointer;transition:.15s;}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal);}

  main{flex:1;padding:8px 16px 40px;overflow-y:auto;}
  .countLine{font-size:13px;color:var(--soft);margin:6px 2px 12px;}

  .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;}
  .card .row{display:flex;align-items:flex-start;gap:10px;}
  .card .title{font-weight:700;font-size:16px;flex:1;}
  .card .meta{font-size:13px;color:var(--soft);margin-top:3px;}
  .tag{display:inline-block;background:var(--teal-soft);color:var(--teal-deep);font-size:12px;
    padding:2px 9px;border-radius:10px;margin:4px 4px 0 0;font-weight:700;}
  .tag.amber{background:var(--amber-soft);color:#8a5c1e;}
  .tag.mute{background:var(--card2);color:var(--soft);}
  .mini{font-size:12px;color:var(--soft);}

  .empty{text-align:center;color:var(--soft);padding:48px 16px;}
  .empty .big{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px;}

  .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{padding:6px 12px;border:2px solid var(--line);border-radius:14px;background:var(--card);
    color:var(--soft);font-size:13px;font-weight:700;cursor:pointer;}
  .chip.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-deep);}
  .chip.wide{width:100%;text-align:center;}
  .chip.primary{background:var(--teal);color:#fff;border-color:var(--teal);}
  .chip.danger{background:var(--card);color:var(--err);border-color:var(--err);}

  label{display:block;font-size:13px;color:var(--soft);font-weight:700;margin:12px 0 5px;}
  input,select,textarea{width:100%;border:2px solid var(--line);border-radius:13px;padding:11px;font-size:15px;
    background:var(--card);color:var(--ink);font-family:inherit;}
  textarea{resize:vertical;min-height:64px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:64px;padding:10px;border:2px solid var(--line);border-radius:13px;background:var(--card);
    color:var(--soft);font-weight:700;cursor:pointer;font-size:13px;}
  .seg button.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .btns{display:flex;gap:10px;margin-top:18px;}
  .btns button{flex:1;padding:13px;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;border:2px solid var(--line);}
  .btns .save{background:var(--teal);color:#fff;border-color:var(--teal);}
  .btns .cancel{background:var(--card);color:var(--soft);}
  .del{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:2px solid var(--err);
    background:var(--card);color:var(--err);font-weight:800;font-size:15px;cursor:pointer;}

  .mask{position:fixed;inset:0;background:rgba(30,45,45,.45);z-index:40;display:none;}
  .mask.on{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);z-index:50;border-radius:22px 22px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;
    transform:translateY(100%);transition:.25s;max-height:90vh;overflow-y:auto;}
  .sheet.on{transform:translateY(0);}
  .sheet h3{margin:0 0 14px;font-size:18px;}

  /* 身份門檻（全螢幕遮罩） */
  .idgate{position:fixed;inset:0;background:var(--paper);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
  .idgate.on{display:flex;}
  .idcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center;}
  .idcard .ico{font-size:38px;margin-bottom:8px;}
  .idcard h2{font-size:19px;margin:0 0 6px;}
  .idcard p{font-size:13px;color:var(--soft);margin:0 0 16px;}

  /* SOAP 病例詳情 */
  .byline{font-size:12px;color:var(--soft);margin-top:4px;}
  .soapview{background:var(--card2);border-radius:16px;padding:14px;margin-bottom:12px;}
  .soapview-h{font-weight:800;color:var(--teal-deep);font-size:14px;margin-bottom:8px;}
  .soapline{margin-bottom:8px;}
  .soapline:last-child{margin-bottom:0;}
  .soaplbl{display:inline-block;font-weight:800;font-size:11px;color:#fff;background:var(--teal);
    border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px;}
  .soapb{font-size:14px;line-height:1.7;white-space:pre-wrap;display:inline;}
  .discussbox{background:linear-gradient(135deg,var(--amber-soft),var(--card2));border:2px solid var(--amber);
    border-radius:16px;padding:14px;margin-bottom:14px;}
  .discussbox .h{font-weight:800;color:#8a5c1e;font-size:14px;margin-bottom:6px;}
  .discussbox .b{font-size:14px;line-height:1.7;white-space:pre-wrap;}

  .qcard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
  .qcard .qn{font-weight:800;font-size:15px;margin-bottom:10px;}
  .optbtn{display:block;width:100%;text-align:left;padding:11px 13px;border:2px solid var(--line);border-radius:13px;
    background:var(--card);color:var(--ink);font-size:14px;margin-bottom:8px;cursor:pointer;}
  .optbtn.on{border-color:var(--teal);background:var(--teal-soft);font-weight:700;}
  .optbtn.correct{border-color:var(--ok);background:#e7f3ec;color:var(--ok);font-weight:700;}
  .optbtn.wrong{border-color:var(--err);background:#fbeae7;color:var(--err);font-weight:700;}
  .optbtn:disabled{cursor:default;}
  .explain{margin-top:8px;background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink);line-height:1.6;}
  .explain b{color:var(--teal-deep);}
  .selfrate{display:flex;gap:8px;margin-top:10px;}
  .selfrate button{flex:1;padding:9px 4px;border:2px solid var(--line);border-radius:12px;background:var(--card);
    color:var(--soft);font-size:12px;font-weight:700;cursor:pointer;}
  .selfrate button.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .myresp{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-bottom:6px;}

  .scorebox{background:linear-gradient(135deg,var(--amber-soft),var(--card2));border:2px solid var(--amber);
    border-radius:18px;padding:16px;margin-bottom:14px;text-align:center;}
  .scorebox .big{font-size:30px;font-weight:800;color:#8a5c1e;}
  .scorebox .sub{font-size:13px;color:var(--soft);margin-top:2px;}

  .statrow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid var(--card2);}
  .statrow:last-child{border-bottom:none;}
  .statrow b{color:var(--teal-deep);}

  .pinwrap{max-width:320px;margin:40px auto;text-align:center;}
  .pinwrap .ico{font-size:36px;margin-bottom:8px;}

  .adminrow{display:flex;align-items:center;gap:10px;}
  .adminrow .info{flex:1;}
  .iconbtn{border:none;background:var(--card2);color:var(--teal-deep);border-radius:10px;width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0;}
  .iconbtn.del{color:var(--err);}

  .soapedit{border:2px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:12px;}
  .soapedit-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;}
  .soapedit-h input{font-weight:700;}
  .qedit{border:2px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:12px;}
  .qedit-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .qedit-h .lbl{font-weight:800;font-size:13px;color:var(--teal-deep);}
  .optrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .optrow input{flex:1;}
  .optrow .radiomark{width:26px;height:26px;border:2px solid var(--line);border-radius:50%;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .optrow .radiomark.on{background:var(--ok);border-color:var(--ok);}
  .attempt-item{border-top:1px solid var(--card2);padding-top:10px;margin-top:10px;}
  .accordion{cursor:pointer;}
</style>
</head>

    <button class="chip primary wide" id="idNameSave" style="margin-top:14px;padding:12px">開始使用</button>

</div>

<script>
/* ===== 本機儲存 key ===== */
const CASE_KEY="ct_cases", TRAINEE_KEY="ct_trainees", ATTEMPT_KEY="ct_attempts";
const MY_ID_KEY="ct_my_id", MY_NAME_KEY="ct_my_name", ADMIN_OK_KEY="ct_admin_ok";

function load(k,d){ try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){return String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fmtDate(ts){ if(!ts) return ""; const d=new Date(ts); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function blankRound(label){ return {id:uid(), label:label||"", s:"", o:"", a:"", p:""}; }

/* ===== 種子病例（第一次使用時的範例，示範「一個大 SOAP 由數個小 SOAP 組成」） ===== */
function seedCases(){
  return [
    {
      id:uid(), title:"右側腰背緊繃合併肩舉受限（案例示範：多輪 SOAP 假設檢驗）",
      createdBy:{id:"seed", name:"系統範例"}, createdAt:Date.now(),
      soapRounds:[
        {
          id:uid(), label:"初次評估與快速治療測試",
          s:"主述：\n1. 身體側彎向左時，右腰會很緊，接近肋骨下緣、靠近胸腰關節（TL junction）附近。\n2. 右手舉手時角度受限，會有卡卡的感覺。",
          o:"站姿：軀幹向右旋轉、右側骨盆前傾、右側肩胛骨下轉。\n坐姿：右側骨盆上提合併前傾、右側肩胛骨下轉。\n動作測試：軀幹總屈曲時腰椎屈曲不足；總伸直時ASIS可碰到腳趾但頭無法超過腳跟；總旋轉雙側皆受限；向右側屈時右下背有夾擠感；向左側屈時右下背緊繃痠痛（VAS 2/10）。\n觸診：右側第12肋下緣、近L1橫突處有壓痛點；右側豎脊肌緊繃；胸腰筋膜張力偏高。",
          a:"懷疑右側方形肌（QL）、右側胸大肌（Pectoralis Major）、右側闊背肌（Latissimus Dorsi）緊繃導致上述症狀。",
          p:"以快速治療測試逐一驗證假設：\n・放鬆QL → 無明顯進步\n・放鬆胸大肌 → 約10%進步\n・放鬆闊背肌 → 明顯進步 👍\n補充問診：個案最近背部訓練較多（每週2-3次），近期教練沒有安排胸部訓練。"
        },
        {
          id:uid(), label:"運動評估與介入",
          s:"（承上一輪問診：訓練習慣背多於胸，可能與代償型態有關）",
          o:"皮拉提斯動作評估：\n・伏地挺身：出現肩胛骨翼狀突出（scapula winging）\n・仰臥側滾至左側：動作品質差（抬腳跟時無法控制速度）",
          a:"懷疑前鋸肌（SA）無法與闊背肌產生交互抑制（reciprocal inhibition）；前側斜線筋膜張力過高，導致軀幹旋轉主動關節活動度不足。",
          p:"平衡肌群訓練：四足跪姿伏地挺身變化式（all-four push up plus）、槓鈴臥推 plus；側滾至左側動作訓練。\n柔軟度訓練：屈肘開書式（open book）訓練腹肌；風車式（pinwheel）訓練前側斜線筋膜與闊背肌。"
        },
        {
          id:uid(), label:"介入後複測",
          s:"",
          o:"雙側軀幹側屈時，右下背已無夾擠/怪異感；軀幹旋轉AROM進步；右手舉手時已無緊繃感。",
          a:"",
          p:""
        }
      ],
      discussion:"討論問題：\n1. 如果闊背肌放鬆後的效果只能維持短期，你會怎麼調整介入策略？\n2. 除了前鋸肌與前側斜線筋膜，還有哪些構造或動作控制因素可能造成這位個案的旋轉活動度受限？\n3. 這個案例的假設檢驗順序（先QL、再胸大肌、最後闊背肌）合理嗎？如果是你，會怎麼安排優先順序？",
      questions:[]
    },
    {
      id:uid(), title:"肩關節術後夾擠症狀（案例示範：含測驗題）",
      createdBy:{id:"seed", name:"系統範例"}, createdAt:Date.now()-1000,
      soapRounds:[
        {
          id:uid(), label:"初次評估",
          s:"45歲女性，肩關節鏡下夾擠症清創術後第4週，主訴上舉過頭時前側肩膀疼痛（VAS 4/10）。",

          a:"懷疑術後仍有肩峰下發炎反應，合併肩胛骨動作控制不良（scapular dyskinesis）代償。",

        }
      ],
      discussion:"",
      questions:[
        {id:uid(),type:"mcq",prompt:"此階段治療最應避免的動作是？",
          options:["疼痛範圍內的被動關節活動度訓練","過頭負重的阻力訓練","下斜方肌啟動運動","肩胛骨穩定訓練"],
          answerIdx:1,
          explanation:"術後早期合併夾擠症狀時，過頭負重的阻力訓練容易加重肩峰下發炎，應優先處理發炎與動作控制，待症狀穩定再漸進負重。"}
      ]
    }
  ];
}

let trainees = load(TRAINEE_KEY, []);
let attempts = load(ATTEMPT_KEY, []);

let myId   = localStorage.getItem(MY_ID_KEY) || "";
let myName = localStorage.getItem(MY_NAME_KEY) || "";
let adminUnlocked = localStorage.getItem(ADMIN_OK_KEY) === "1";

let view = "library";
let libNav = "list";        // list | quiz
let openCaseId = null;
let curQuiz = null;          // {caseId, submitted, attemptId, selected, responses}

let adminSub = "cases";      // cases | trainees
let adminExpand = null;      // 展開中的學員 id

/* ===== 儲存 ===== */
function saveCases(){ localStorage.setItem(CASE_KEY,JSON.stringify(cases)); cloudPush(); }
function saveTrainees(){ localStorage.setItem(TRAINEE_KEY,JSON.stringify(trainees)); cloudPush(); }
function saveAttempts(){ localStorage.setItem(ATTEMPT_KEY,JSON.stringify(attempts)); cloudPush(); }

/* ===== Firebase 雲端同步 ===== */
const SHARE_DOC = "fae67c9acc9873b47976c33d2c862243";
const cloudRef = window.__db ? window.__db.collection("therapist_cases").doc(SHARE_DOC) : null;

let cloudReady=false, cloudSkipPush=false, cloudTimer=null;

function cloudPush(){
  if(!cloudRef) return;
  if(cloudSkipPush){ cloudSkipPush=false; return; }
  if(!cloudReady) return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{
    cloudRef.set({ cases, trainees, attempts, updatedAt:Date.now() })
      .then(()=>setSyncBadge("ok"))
      .catch(e=>{ console.warn("雲端儲存失敗",e); setSyncBadge("err"); });
  },800);
}
function cloudInit(){
  if(!cloudRef){ setSyncBadge("local"); return; }
  setSyncBadge("loading");
  cloudRef.onSnapshot(snap=>{
    if(snap.exists){
      const d=snap.data();
      cloudSkipPush=true;
      if(Array.isArray(d.cases))    cases=d.cases;
      if(Array.isArray(d.trainees)) trainees=d.trainees;
      if(Array.isArray(d.attempts)) attempts=d.attempts;
      localStorage.setItem(CASE_KEY,JSON.stringify(cases));
      localStorage.setItem(TRAINEE_KEY,JSON.stringify(trainees));
      localStorage.setItem(ATTEMPT_KEY,JSON.stringify(attempts));
      cloudReady=true; setSyncBadge("ok"); render();
    }else{
      cloudReady=true;
      cloudRef.set({ cases, trainees, attempts, updatedAt:Date.now() })
        .then(()=>setSyncBadge("ok")).catch(()=>setSyncBadge("err"));
    }
  }, err=>{ console.warn("雲端讀取失敗",err); setSyncBadge("err"); cloudReady=false; });
}
function setSyncBadge(state){
  const el=document.getElementById("syncBadge"); if(!el) return;
  const map={loading:"☁️ 同步中…",ok:"☁️ 已同步",err:"⚠️ 同步異常",local:"📵 本機模式"};
  el.textContent=map[state]||""; el.className="sync-badge "+state;
}

/* ===== 身份 ===== */
function ensureIdentity(){
  const gate=document.getElementById("idgate");
  if(myId && myName){
    gate.classList.remove("on");
    document.getElementById("whoName").textContent=myName;
    return true;
  }
  gate.classList.add("on");
  document.getElementById("idNameInput").value="";
  document.getElementById("idNameInput").focus();
  return false;
}
function saveIdentity(name){
  name=(name||"").trim();
  if(!name){ alert("請輸入姓名或代號"); return; }
  myId=uid(); myName=name;
  localStorage.setItem(MY_ID_KEY,myId);
  localStorage.setItem(MY_NAME_KEY,myName);
  if(!trainees.some(t=>t.id===myId)){
    trainees.push({id:myId,name:myName,createdAt:Date.now()});
    saveTrainees();
  }
  ensureIdentity();
  render();
}
document.getElementById("idNameSave").onclick=()=>saveIdentity(document.getElementById("idNameInput").value);
document.getElementById("idNameInput").addEventListener("keydown",e=>{ if(e.key==="Enter") saveIdentity(e.target.value); });

/* ----- 病例庫：作答 / 閱讀 ----- */
function initQuiz(caseId){
  curQuiz = { caseId, submitted:false, attemptId:null, selected:{}, responses:{} };
}
function scoreAttempt(a){
  const max=a.answers.length;
  const score=a.answers.reduce((s,x)=> s + (x.type==="mcq" ? (x.correct?1:0) : (x.selfRate??0)), 0);
  a.maxScore=max; a.score=score;
}
function renderQuiz(){
  const main=document.getElementById("main");
  const c=cases.find(x=>x.id===openCaseId);
  if(!c){ libNav="list"; render(); return; }

  let html=`<div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="chip" id="backLib">‹ 返回病例庫</button>
      ${canEdit(c)?`<button class="chip" id="editThis">✎ 編輯</button>`:""}
    </div>`;
  html+=`<div class="card" style="margin-bottom:10px">
      <div class="title">📋 ${esc(c.title)}</div>
      <div class="byline">由 ${esc(c.createdBy?c.createdBy.name:"未知")} 建立・${fmtDate(c.createdAt)}</div>
    </div>`;

  (c.soapRounds||[]).forEach((r,ri)=>{
    html+=`<div class="soapview">
        <div class="soapview-h">🔁 第 ${ri+1} 輪${r.label?`：${esc(r.label)}`:""}</div>`;
    [["S",r.s],["O",r.o],["A",r.a],["P",r.p]].forEach(([lbl,val])=>{
      if(val && val.trim()){
        html+=`<div class="soapline"><span class="soaplbl">${lbl}</span><span class="soapb">${esc(val)}</span></div>`;
      }
    });
    html+=`</div>`;
  });

  if(c.discussion && c.discussion.trim()){
    html+=`<div class="discussbox"><div class="h">💬 討論／反思</div><div class="b">${esc(c.discussion)}</div></div>`;
  }

  const questions=c.questions||[];
  const attempt = curQuiz.submitted ? attempts.find(a=>a.id===curQuiz.attemptId) : null;

  if(!questions.length){
    html+=`<div class="mini" style="text-align:center;padding:12px 0">這個病例沒有附加測驗，純供研讀與討論。</div>`;
  }else{
    questions.forEach((q,qi)=>{
      const ansEntry = attempt ? attempt.answers.find(a=>a.qid===q.id) : null;
      html+=`<div class="qcard"><div class="qn">Q${qi+1}. ${esc(q.prompt)}</div>`;
      if(q.type==="mcq"){
        (q.options||[]).forEach((opt,oi)=>{
          let cls="";
          if(curQuiz.submitted){
            if(oi===q.answerIdx) cls="correct";
            else if(oi===(ansEntry?ansEntry.selectedIdx:-1)) cls="wrong";
          }else if(curQuiz.selected[q.id]===oi){ cls="on"; }
          html+=`<button class="optbtn ${cls}" data-mcq="${q.id}|${oi}" ${curQuiz.submitted?"disabled":""}>${esc(opt)}</button>`;
        });
        if(curQuiz.submitted && q.explanation){
          html+=`<div class="explain"><b>說明：</b>${esc(q.explanation)}</div>`;
        }
      }else{
        if(!curQuiz.submitted){
          html+=`<textarea data-open="${q.id}" placeholder="輸入你的想法…">${esc(curQuiz.responses[q.id]||"")}</textarea>`;
        }else{
          html+=`<div class="myresp">${esc(ansEntry?ansEntry.response:"").replace(/\n/g,"<br>")||"（未作答）"}</div>
            <div class="explain"><b>參考答案：</b>${esc(q.modelAnswer||"")}</div>
            <div class="mini" style="margin-top:8px">請對照參考答案自評：</div>
            <div class="selfrate">
              <button class="${ansEntry.selfRate===0?'on':''}" data-rate="${q.id}|0">待加強</button>
              <button class="${ansEntry.selfRate===0.5?'on':''}" data-rate="${q.id}|0.5">普通</button>
              <button class="${ansEntry.selfRate===1?'on':''}" data-rate="${q.id}|1">答對</button>
            </div>`;
        }
      }
      html+=`</div>`;
    });

    if(!curQuiz.submitted){
      html+=`<button class="chip primary wide" id="submitQuiz" style="padding:13px">提交作答</button>`;
    }else if(attempt){
      const pct=Math.round(100*attempt.score/Math.max(attempt.maxScore,1));
      html+=`<div class="scorebox"><div class="big">${pct}%</div><div class="sub">本次得分 ${attempt.score} / ${attempt.maxScore}</div></div>`;
      html+=`<button class="chip wide" id="doneQuiz" style="padding:13px">完成，返回病例庫</button>`;
    }
  }

  main.innerHTML=html;
  document.getElementById("backLib").onclick=()=>{ libNav="list"; curQuiz=null; render(); };
  const editBtn=document.getElementById("editThis");
  if(editBtn) editBtn.onclick=()=>openCaseEditor(c.id);
  main.querySelectorAll("[data-mcq]").forEach(b=>b.onclick=()=>{
    const [qid,oi]=b.dataset.mcq.split("|");
    curQuiz.selected[qid]=Number(oi); renderQuiz();
  });
  main.querySelectorAll("[data-open]").forEach(ta=>ta.oninput=()=>{
    curQuiz.responses[ta.dataset.open]=ta.value;
  });
  const submitBtn=document.getElementById("submitQuiz");
  if(submitBtn) submitBtn.onclick=()=>submitQuiz(c);
  main.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{
    const [qid,val]=b.dataset.rate.split("|");
    const a=attempts.find(x=>x.id===curQuiz.attemptId);
    const entry=a.answers.find(x=>x.qid===qid);
    entry.selfRate=Number(val);
    scoreAttempt(a); saveAttempts(); renderQuiz();
  });
  const doneBtn=document.getElementById("doneQuiz");
  if(doneBtn) doneBtn.onclick=()=>{ libNav="list"; curQuiz=null; render(); };
}
function submitQuiz(c){
  const answers=(c.questions||[]).map(q=>{
    if(q.type==="mcq"){
      const selectedIdx = curQuiz.selected[q.id];
      return {qid:q.id, type:"mcq", selectedIdx: selectedIdx===undefined?-1:selectedIdx, correct: selectedIdx===q.answerIdx};
    }
    return {qid:q.id, type:"open", response: curQuiz.responses[q.id]||"", selfRate:null};
  });
  const attempt={
    id:uid(), traineeId:myId, traineeName:myName,
    caseId:c.id, caseTitle:c.title,
    answers, submittedAt:Date.now()
  };
  scoreAttempt(attempt);
  attempts.push(attempt);
  saveAttempts();
  curQuiz.submitted=true; curQuiz.attemptId=attempt.id;
  renderQuiz();
}

/* ----- 病例編輯表單（學員新增／編輯自己的病例，或管理者編輯任何病例） ----- */
let editCase=null;
function openCaseEditor(caseId){
  if(caseId){
    const src=cases.find(c=>c.id===caseId);
    if(!canEdit(src)){ alert("這不是你建立的病例，且管理後台尚未解鎖，無法編輯。"); return; }
    editCase = clone(src);
  }else{
    editCase = {id:uid(), title:"", createdBy:{id:myId,name:myName}, createdAt:Date.now(), soapRounds:[blankRound("初次評估")], discussion:"", questions:[]};
  }
  openSheet(caseEditorHTML(!!caseId));
  bindCaseEditor(!!caseId);
}
function caseEditorHTML(isEdit){
  let h=`<h3>${isEdit?"編輯病例":"新增病例"}</h3>
    <div class="mini" style="margin-bottom:6px">用 SOAP（主觀 S／客觀 O／評估 A／處置 P）記錄病例，一輪代表一次評估或介入循環，可以無限新增輪次，每格都是自由文字，想怎麼寫都可以。</div>
    <label>病例標題</label>
    <input id="ceTitle" value="${esc(editCase.title)}" placeholder="例如：右側腰背緊繃合併肩舉受限">
    <label>SOAP 輪次</label>`;
  (editCase.soapRounds||[]).forEach((r,ri)=>{
    h+=`<div class="soapedit">
        <div class="soapedit-h">
          <input data-rlabel="${ri}" value="${esc(r.label)}" placeholder="第${ri+1}輪標題（選填，例如：初次評估／介入後複測）">
          <button class="iconbtn del" data-rdel="${ri}">🗑</button>
        </div>
        <label style="margin:8px 0 3px">S 主觀資料</label>
        <textarea data-rs="${ri}" placeholder="病人主訴、症狀描述…">${esc(r.s)}</textarea>
        <label style="margin:8px 0 3px">O 客觀檢查</label>
        <textarea data-ro="${ri}" placeholder="可自由書寫，例如：站姿觀察…&#10;動作測試…&#10;觸診…">${esc(r.o)}</textarea>
        <label style="margin:8px 0 3px">A 評估／假設</label>
        <textarea data-ra="${ri}" placeholder="臨床推理、懷疑的問題點…">${esc(r.a)}</textarea>
        <label style="margin:8px 0 3px">P 處置／計畫</label>
        <textarea data-rp="${ri}" placeholder="治療手法、運動處方、結果…">${esc(r.p)}</textarea>
      </div>`;
  });
  h+=`<button class="chip wide" id="addRound" style="margin-bottom:14px">＋ 新增下一輪 SOAP</button>`;
  h+=`<label>討論／反思（選填）</label>
    <textarea id="ceDiscuss" placeholder="例如：如果這個假設不成立，還有哪些可能？">${esc(editCase.discussion||"")}</textarea>`;

  h+=`<label style="margin-top:18px">測驗題（選填，不加也可以直接儲存）</label>`;
  (editCase.questions||[]).forEach((q,qi)=>{
    h+=`<div class="qedit">
        <div class="qedit-h"><span class="lbl">${q.type==="mcq"?"選擇題":"問答題"} ${qi+1}</span>
          <button class="iconbtn del" data-qdel="${qi}">🗑</button></div>
        <textarea data-qprompt="${qi}" placeholder="題目內容">${esc(q.prompt)}</textarea>`;
    if(q.type==="mcq"){
      (q.options||[]).forEach((opt,oi)=>{
        h+=`<div class="optrow">
            <div class="radiomark ${q.answerIdx===oi?'on':''}" data-qcorrect="${qi}|${oi}">${q.answerIdx===oi?'✓':''}</div>
            <input data-qopt="${qi}|${oi}" value="${esc(opt)}" placeholder="選項內容">
            <button class="iconbtn del" data-qoptdel="${qi}|${oi}">✕</button>
          </div>`;
      });
      h+=`<button class="chip" data-qoptadd="${qi}" style="margin:4px 0">＋ 新增選項</button>
        <textarea data-qexplain="${qi}" placeholder="正解說明（作答後顯示）">${esc(q.explanation||"")}</textarea>`;
    }else{
      h+=`<textarea data-qmodel="${qi}" placeholder="參考答案（作答後顯示，供學員自評）">${esc(q.modelAnswer||"")}</textarea>`;
    }
    h+=`</div>`;
  });
  h+=`<div style="display:flex;gap:8px;margin-top:6px">
      <button class="chip" id="addMcq" style="flex:1">＋ 選擇題</button>
      <button class="chip" id="addOpen" style="flex:1">＋ 問答題</button>
    </div>`;
  h+=`<div class="btns"><button class="cancel" id="ceCancel">取消</button><button class="save" id="ceSave">儲存</button></div>`;
  if(isEdit) h+=`<button class="del" id="ceDel">刪除此病例</button>`;
  return h;
}
function refreshEditorSheet(isEdit){
  document.getElementById("sheet").innerHTML=caseEditorHTML(isEdit);
  bindCaseEditor(isEdit);
}
function bindCaseEditor(isEdit){
  document.getElementById("ceTitle").oninput=e=>editCase.title=e.target.value;
  document.getElementById("ceDiscuss").oninput=e=>editCase.discussion=e.target.value;

  document.querySelectorAll("[data-rlabel]").forEach(inp=>inp.oninput=e=>{ editCase.soapRounds[+inp.dataset.rlabel].label=e.target.value; });
  document.querySelectorAll("[data-rs]").forEach(t=>t.oninput=e=>{ editCase.soapRounds[+t.dataset.rs].s=e.target.value; });
  document.querySelectorAll("[data-ro]").forEach(t=>t.oninput=e=>{ editCase.soapRounds[+t.dataset.ro].o=e.target.value; });
  document.querySelectorAll("[data-ra]").forEach(t=>t.oninput=e=>{ editCase.soapRounds[+t.dataset.ra].a=e.target.value; });
  document.querySelectorAll("[data-rp]").forEach(t=>t.oninput=e=>{ editCase.soapRounds[+t.dataset.rp].p=e.target.value; });
  document.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=()=>{
    if(editCase.soapRounds.length<=1){ alert("至少要保留一輪 SOAP"); return; }
    editCase.soapRounds.splice(+b.dataset.rdel,1); refreshEditorSheet(isEdit);
  });
  document.getElementById("addRound").onclick=()=>{
    editCase.soapRounds.push(blankRound("")); refreshEditorSheet(isEdit);
  };

  document.querySelectorAll("[data-qprompt]").forEach(t=>t.oninput=e=>{ editCase.questions[+t.dataset.qprompt].prompt=e.target.value; });
  document.querySelectorAll("[data-qexplain]").forEach(t=>t.oninput=e=>{ editCase.questions[+t.dataset.qexplain].explanation=e.target.value; });
  document.querySelectorAll("[data-qmodel]").forEach(t=>t.oninput=e=>{ editCase.questions[+t.dataset.qmodel].modelAnswer=e.target.value; });
  document.querySelectorAll("[data-qopt]").forEach(inp=>inp.oninput=e=>{
    const [qi,oi]=inp.dataset.qopt.split("|"); editCase.questions[+qi].options[+oi]=e.target.value;
  });
  document.querySelectorAll("[data-qcorrect]").forEach(b=>b.onclick=()=>{
    const [qi,oi]=b.dataset.qcorrect.split("|"); editCase.questions[+qi].answerIdx=+oi; refreshEditorSheet(isEdit);
  });
  document.querySelectorAll("[data-qoptadd]").forEach(b=>b.onclick=()=>{
    editCase.questions[+b.dataset.qoptadd].options.push(""); refreshEditorSheet(isEdit);
  });
  document.querySelectorAll("[data-qoptdel]").forEach(b=>b.onclick=()=>{
    const [qi,oi]=b.dataset.qoptdel.split("|"); const q=editCase.questions[+qi];
    q.options.splice(+oi,1);
    if(q.answerIdx>=q.options.length) q.answerIdx=0;
    refreshEditorSheet(isEdit);
  });
  document.querySelectorAll("[data-qdel]").forEach(b=>b.onclick=()=>{
    editCase.questions.splice(+b.dataset.qdel,1); refreshEditorSheet(isEdit);
  });
  document.getElementById("addMcq").onclick=()=>{
    editCase.questions.push({id:uid(),type:"mcq",prompt:"",options:["",""],answerIdx:0,explanation:""});
    refreshEditorSheet(isEdit);
  };
  document.getElementById("addOpen").onclick=()=>{
    editCase.questions.push({id:uid(),type:"open",prompt:"",modelAnswer:""});
    refreshEditorSheet(isEdit);
  };
  document.getElementById("ceCancel").onclick=closeSheet;
  document.getElementById("ceSave").onclick=()=>{
    if(!editCase.title.trim()){ alert("請輸入病例標題"); return; }
    if(!editCase.soapRounds.length){ alert("請至少保留一輪 SOAP"); return; }
    for(const q of editCase.questions){
      if(!q.prompt.trim()){ alert("有測驗題目是空的，請補齊或刪除該題"); return; }
      if(q.type==="mcq" && (q.options||[]).some(o=>!o.trim())){ alert("選擇題的選項內容不能空白"); return; }
    }
    const idx=cases.findIndex(c=>c.id===editCase.id);
    if(idx>=0) cases[idx]=editCase; else cases.push(editCase);
    saveCases(); closeSheet(); render();
  };
  const delBtn=document.getElementById("ceDel");
  if(delBtn) delBtn.onclick=()=>{
    if(confirm("確定要刪除這個病例嗎？（已作答的紀錄仍會保留）")){
      cases=cases.filter(c=>c.id!==editCase.id); saveCases(); closeSheet(); render();
    }
  };
}

/* ===== 啟動 ===== */
ensureIdentity();
render();
cloudInit();
</script>
</body>
</html>
