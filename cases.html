<!--
  使用說明
  1. 這個頁面與 index.html（旅遊手帳）是同一個 repo 裡的獨立頁面，功能互不干擾。
  2. 沿用同一個 Firebase 專案（方便設定），但存在不同的 collection，不會跟旅遊/居家資料混在一起。
  3. 沒網路時自動只用本機儲存，照常可用；有網路時會自動同步，讓不同新進治療師的作答紀錄互通。
  4. 病例採用通用 SOAP 格式（不分骨科/心肺/神經/小兒），一個病例可以由多輪 S/O/A/P 組成
     （例如：初次評估 → 治療測試 → 再評估 → 運動處方 → 複測），每一輪可以各自標記看診日期，
     用來記錄同一位病人跨越多次治療的完整病程；輪數不限，每輪內容都是自由文字。
  5. 每位新進治療師都可以自己「＋ 新增病例」練習寫 SOAP，儲存後立即公開在病例庫。
  6. 「管理後台」用一組簡單的 PIN 碼把關（不是正式帳密系統），PIN 碼可在下面 ADMIN_PIN 直接修改；
     管理者可以編輯/刪除任何人的病例，一般學員只能編輯/刪除自己建立的病例。
-->

<script>
/* ===== 本機儲存 key ===== */
const CASE_KEY="ct_cases", TRAINEE_KEY="ct_trainees";
const MY_ID_KEY="ct_my_id", MY_NAME_KEY="ct_my_name", ADMIN_OK_KEY="ct_admin_ok";

function load(k,d){ try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){return String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fmtDate(ts){ if(!ts) return ""; const d=new Date(ts); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function blankRound(label, date, newVisit){ return {id:uid(), label:label||"", date:date||"", newVisit:!!newVisit, complaintIdx:[], items:{}, general:{o:"",a:"",p:""}}; }
function blankDemo(){ return {surname:"", gender:"", age:"", occupation:"", chronicHas:false, chronicDetail:"", sport:"", exerciseFreq:""}; }
/* 姓氏＋性別 → 稱謂，例如「李先生」「李小姐」；沒填姓氏就退回單純性別 */
function honorific(d){
  if(!d) return "";
  if(d.surname){
    if(d.gender==="男") return d.surname+"先生";
    if(d.gender==="女") return d.surname+"小姐";
    return d.surname;
  }
  return d.gender||"";
}
function demoSummary(d){
  if(!d) return "";
  const parts=[];
  const h=honorific(d); if(h) parts.push(h);
  if(d.age) parts.push(d.age+"歲");
  if(d.occupation) parts.push(d.occupation);
  parts.push(d.chronicHas ? `慢性病：${d.chronicDetail||"有"}` : "無慢性病");
  if(d.sport) parts.push(d.sport+(d.exerciseFreq?`（${d.exerciseFreq}）`:""));
  else if(d.exerciseFreq) parts.push(d.exerciseFreq);
  return parts.join("・");
}
const CIRCLE_NUMS=["","①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
function circleNum(n){ return CIRCLE_NUMS[n] || `(${n})`; }
/* 主訴可以有子項目（治療後衍生的追蹤描述），依「父項目在前、子項目緊接在後」排序顯示 */
function orderedComplaintIndices(complaints){
  const result=[];
  (complaints||[]).forEach((c,gi)=>{ if(c.parent==null) result.push(gi); });
  const withKids=[];
  result.forEach(pgi=>{
    withKids.push(pgi);
    (complaints||[]).forEach((c,gi)=>{ if(c.parent===pgi) withKids.push(gi); });
  });
  return withKids;
}
/* 主訴編號：頂層用①②③；子項目沿用父項目編號加上序號，例如①-1、①-2 */
function complaintLabels(complaints){
  const labels={};
  let topCount=0; const subCounts={};
  orderedComplaintIndices(complaints).forEach(gi=>{
    const c=complaints[gi];
    if(c.parent==null){ topCount++; labels[gi]=circleNum(topCount); subCounts[gi]=0; }
    else{ subCounts[c.parent]=(subCounts[c.parent]||0)+1; labels[gi]=`${labels[c.parent]}-${subCounts[c.parent]}`; }
  });
  return labels;
}
/* 舊資料相容：
   - 主訴以前是每一輪各自維護一份陣列（r.s），現在改成整個病例共用一份主訴清單
     （c.complaints，每項 {text,parent}），每一輪只是「勾選」要處理哪幾項
     （r.complaintIdx，索引指向 c.complaints），O/A/P 則存在 r.items（以主訴索引
     為 key 的物件），沒有勾選任何主訴時退回單一組共用的 general O/A/P。
   - 主訴清單更早之前是純字串陣列，也一併轉換成 {text,parent:null}。
   - 更早期版本 O/A/P 曾經是單一共用字串（r.o/r.a/r.p），也一併轉換。 */
function normalizeCase(c){
  if(!Array.isArray(c.complaints)) c.complaints=[];
  c.complaints = c.complaints.map(item=>
    typeof item==="string" ? {text:item, parent:null} : {text:item.text||"", parent: item.parent==null?null:item.parent}
  );
  (c.soapRounds||[]).forEach((r,i)=>{
    if(typeof r.date!=="string") r.date="";
    if(typeof r.newVisit!=="boolean"){
      // 舊資料沒有 newVisit 標記：用「日期跟上一輪不同」推斷是否為新回診的第一輪
      const prevDate = i>0 ? (c.soapRounds[i-1].date||"") : null;
      r.newVisit = i===0 || (r.date||"")!==prevDate;
    }
    if(!r.newVisit) r.date="";
    if(!r.general) r.general={o:"",a:"",p:""};
    if(!Array.isArray(r.complaintIdx)){
      let oldS=r.s;
      if(typeof oldS==="string") oldS = oldS.trim() ? [oldS.trim()] : [];
      if(!Array.isArray(oldS)) oldS=[];
      const oldItemsArr = Array.isArray(r.items) ? r.items : null;
      if(!oldS.length && oldItemsArr===null && (r.o||r.a||r.p)){
        r.general = {o:r.o||"", a:r.a||"", p:r.p||""};
      }
      const complaintIdx=[];
      const items={};
      oldS.forEach((text,i)=>{
        let gi=c.complaints.findIndex(x=>x.text===text);
        if(gi===-1){ c.complaints.push({text,parent:null}); gi=c.complaints.length-1; }
        complaintIdx.push(gi);
        items[gi] = (oldItemsArr && oldItemsArr[i]) || {o:"",a:"",p:""};
      });
      r.complaintIdx=complaintIdx;
      r.items=items;
    }
    delete r.s; delete r.o; delete r.a; delete r.p;
  });
  if(typeof c.discussion!=="string") c.discussion="";
  if(!c.demographics || typeof c.demographics!=="object") c.demographics=blankDemo();
  else c.demographics=Object.assign(blankDemo(), c.demographics);
  return c;
}

/* ===== 種子病例（第一次使用時的範例，示範「一個大 SOAP 由數個小 SOAP 組成」） ===== */
function seedCases(){
  return [
    {
      id:uid(), title:"2026/07/20 明德 陳先生 右側腰背緊繃合併肩舉受限（案例示範：多輪 SOAP 假設檢驗）",
      createdBy:{id:"seed", name:"系統範例"}, createdAt:Date.now(),
      demographics:{surname:"陳", gender:"男", age:"28", occupation:"上班族", chronicHas:false, chronicDetail:"", sport:"重量訓練", exerciseFreq:"每週2-3次"},
      complaints:[
        {text:"身體側彎向左時，右腰會很緊，接近肋骨下緣、靠近胸腰關節（TL junction）附近。", parent:null},
        {text:"右手舉手時角度受限，會有卡卡的感覺。", parent:null},
        {text:"下背已無明顯緊繃，但久坐超過1小時後仍偶爾感到些微不適（治療後追蹤新增）。", parent:0}
      ],
      soapRounds:[
        {
          id:uid(), label:"初次評估與快速治療測試", date:"2026-07-20", newVisit:true,
          complaintIdx:[0,1],
          items:{

/* 把病例的 SOAP 輪次分組成一次次回診紀錄。每一輪不用各自填日期——只有「開啟新回診」
   的那一輪（第一輪、或標記 newVisit 的輪次）才帶日期，後面接續的輪次自動算同一次回診，
   不看它們自己的 date 欄位（避免因為填寫順序造成日期對不起來）。
   只要日期相同（例如同一天做了好幾輪主訴衍生的追蹤治療），就一定合併成同一張回診卡片，
   不會出現兩張日期一樣的卡片。 */
function groupVisits(rounds){
  const raw=[];
  (rounds||[]).forEach((r,i)=>{
    if(i===0 || r.newVisit || !raw.length){
      raw.push({key:r.id, date:r.date||"", rounds:[]});
    }
    raw[raw.length-1].rounds.push(r);
  });
  const groups=[];
  const byDate=new Map();
  raw.forEach(g=>{
    if(g.date && byDate.has(g.date)){
      byDate.get(g.date).rounds.push(...g.rounds);
    }else{
      groups.push(g);
      if(g.date) byDate.set(g.date, g);
    }
  });
  groups.sort((a,b)=>{
    if(!a.date && !b.date) return 0;
    if(!a.date) return 1;
    if(!b.date) return -1;
    return a.date.localeCompare(b.date);
  });
  return groups;
}

/* ===== Firebase 雲端同步 ===== */
const SHARE_DOC = "fae67c9acc9873b47976c33d2c862243";
const cloudRef = window.__db ? window.__db.collection("therapist_cases").doc(SHARE_DOC) : null;

let cloudReady=false, cloudSkipPush=false, cloudTimer=null;

function cloudPush(){
  if(!cloudRef) return;
  if(cloudSkipPush){ cloudSkipPush=false; return; }
  if(!cloudReady) return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{
    cloudRef.set({ cases, trainees, updatedAt:Date.now() })
      .then(()=>setSyncBadge("ok"))
      .catch(e=>{ console.warn("雲端儲存失敗",e); setSyncBadge("err"); });
  },800);
}
function cloudInit(){
  if(!cloudRef){ setSyncBadge("local"); return; }
  setSyncBadge("loading");
  cloudRef.onSnapshot(snap=>{
    if(snap.exists){
      const d=snap.data();
      cloudSkipPush=true;
      if(Array.isArray(d.cases))    cases=d.cases.map(normalizeCase);
      if(Array.isArray(d.trainees)) trainees=d.trainees;
      localStorage.setItem(CASE_KEY,JSON.stringify(cases));
      localStorage.setItem(TRAINEE_KEY,JSON.stringify(trainees));
      cloudReady=true; setSyncBadge("ok"); render();
    }else{
      cloudReady=true;
      cloudRef.set({ cases, trainees, updatedAt:Date.now() })
        .then(()=>setSyncBadge("ok")).catch(()=>setSyncBadge("err"));
    }
  }, err=>{ console.warn("雲端讀取失敗",err); setSyncBadge("err"); cloudReady=false; });
}
function setSyncBadge(state){
  const el=document.getElementById("syncBadge"); if(!el) return;
  const map={loading:"☁️ 同步中…",ok:"☁️ 已同步",err:"⚠️ 同步異常",local:"📵 本機模式"};
  el.textContent=map[state]||""; el.className="sync-badge "+state;
}

    return true;
  }

}
function saveIdentity(name){
  name=(name||"").trim();
  if(!name){ alert("請輸入姓名或代號"); return; }
  myId=uid(); myName=name;
  localStorage.setItem(MY_ID_KEY,myId);

  if(!trainees.some(t=>t.id===myId)){
    trainees.push({id:myId,name:myName,createdAt:Date.now()});
    saveTrainees();
  }
  ensureIdentity();
  render();
}

function renderRoundsHTML(rounds, complaints){
  complaints = complaints||[];
  const labels=complaintLabels(complaints);
  let html="";
  (rounds||[]).forEach((r,ri)=>{
    html+=`<div class="soapview">
        <div class="soapview-h">🔁 第 ${ri+1} 輪${r.label?`：${esc(r.label)}`:""}</div>`;
    const idxList=r.complaintIdx||[];
    if(idxList.length){
      orderedComplaintIndices(complaints).forEach(gi=>{
        if(!idxList.includes(gi)) return;
        const txt=complaints[gi].text;
        const it=(r.items||{})[gi]||{};
        html+=`<div class="soapgroup">
            <div class="soapgroup-h"><span class="numbadge">${labels[gi]}</span>${esc(txt)||"（尚未填寫主訴）"}</div>`;
        [["O",it.o],["A",it.a],["P",it.p]].forEach(([lbl,val])=>{
          if(val && val.trim()){
            html+=`<div class="soapline"><span class="soaplbl">${lbl}</span><span class="soapb">${esc(val)}</span></div>`;
          }
        });
        html+=`</div>`;
      });
    }else{
      const g=r.general||{};
      [["O",g.o],["A",g.a],["P",g.p]].forEach(([lbl,val])=>{
        if(val && val.trim()){
          html+=`<div class="soapline"><span class="soaplbl">${lbl}</span><span class="soapb">${esc(val)}</span></div>`;
        }
      });
    }
    html+=`</div>`;
  });
  return html;
}
/* 病例詳情：只有一次回診時直接顯示 SOAP 內容；有多次回診（不同日期）時，
   先列出回診日期清單，點進去才顯示該次回診的 SOAP 輪次，避免全部擠在同一頁。 */
function renderCaseDetail(){
  const main=document.getElementById("main");
  const c=cases.find(x=>x.id===openCaseId);
  if(!c){ libNav="list"; render(); return; }

  const visits=groupVisits(c.soapRounds);
  if(openVisitKey!=null && !visits.some(v=>v.key===openVisitKey)) openVisitKey=null;
  const demoText=demoSummary(c.demographics);
  const headerCard=`<div class="card" style="margin-bottom:10px">
      <div class="title">📋 ${esc(c.title)}</div>
      <div class="byline">由 ${esc(c.createdBy?c.createdBy.name:"未知")} 建立・${fmtDate(c.createdAt)}</div>
      ${demoText?`<div class="demoline"><span class="lbl">👤 </span>${esc(demoText)}</div>`:""}
    </div>`;

  if(openVisitKey==null){
    // 病例總覽：一律以回診日期分卡片呈現（這個人幾月幾號來過幾次），不直接顯示 SOAP 內容
    let html=`<div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="chip" id="backLib">‹ 返回病例庫</button>
        ${canEdit(c)?`<button class="chip" id="editThis">✎ 編輯</button>`:""}
      </div>`;
    html+=headerCard;
    if(canEdit(c)) html+=`<button class="chip primary wide" id="addVisit" style="margin-bottom:12px;padding:12px">＋ 新增回診紀錄（新日期）</button>`;
    html+=`<div class="countLine">共 ${visits.length} 次回診紀錄，點選查看當次 SOAP</div>`;
    html+= visits.length
      ? visits.map(v=>`<div class="card" data-visit="${esc(v.key)}" style="cursor:pointer">
          <div class="row">
            <div style="flex:1">
              <div class="title">📅 ${esc(v.date||"未填日期")}</div>
              <div class="meta">共 ${v.rounds.length} 輪 SOAP</div>
            </div>
            <div class="mini" style="align-self:center">›</div>
          </div>
        </div>`).join("")
      : `<div class="empty"><div class="big">還沒有任何回診紀錄</div>按上方按鈕新增第一次回診吧。</div>`;
    if(c.discussion && c.discussion.trim()){
      html+=`<div class="discussbox"><div class="h">💬 討論／反思</div><div class="b">${esc(c.discussion)}</div></div>`;
    }
    main.innerHTML=html;
    document.getElementById("backLib").onclick=()=>{ libNav="list"; render(); };
    const editBtn=document.getElementById("editThis");
    if(editBtn) editBtn.onclick=()=>openCaseEditor(c.id);
    const addVisitBtn=document.getElementById("addVisit");
    if(addVisitBtn) addVisitBtn.onclick=()=>openCaseEditor(c.id,{addRound:true});
    main.querySelectorAll("[data-visit]").forEach(el=>el.onclick=()=>{
      openVisitKey=el.dataset.visit; render();
    });
    return;
  }

  // 已點進某次回診：顯示該次的 SOAP 輪次
  const visit = visits.find(v=>v.key===openVisitKey);
  const rounds = visit ? visit.rounds : [];
  let html=`<div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="chip" id="backVisits">‹ 返回回診列表</button>
      ${canEdit(c)?`<button class="chip" id="editThis">✎ 編輯</button>`:""}
    </div>`;
  html+=`<div class="card" style="margin-bottom:10px">
      <div class="title">📋 ${esc(c.title)}</div>
      <div class="byline">📅 ${esc(visit&&visit.date?visit.date:"未填日期")}</div>
    </div>`;
  html+=renderRoundsHTML(rounds, c.complaints);
  main.innerHTML=html;
  document.getElementById("backVisits").onclick=()=>{ openVisitKey=null; render(); };
  const editBtn=document.getElementById("editThis");
  if(editBtn) editBtn.onclick=()=>openCaseEditor(c.id);
}

  let html=`<div class="chip-row">
      <button class="chip ${adminSub==='cases'?'on':''}" data-asub="cases">病例管理</button>
      <button class="chip ${adminSub==='trainees'?'on':''}" data-asub="trainees">學員紀錄</button>
      <button class="chip" id="adminLock" style="margin-left:auto">🔒 鎖定</button>
    </div>`;

  if(adminSub==="cases"){
    html+=`<button class="chip primary wide" id="addCase" style="margin-bottom:12px;padding:12px">＋ 新增病例</button>`;
    if(!cases.length){
      html+=`<div class="empty"><div class="big">還沒有病例</div>按上方按鈕新增第一個病例。</div>`;
    }else{
      html+=cases.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(c=>`<div class="card"><div class="adminrow">
          <div class="info">
            <div class="title">${esc(c.title)}</div>
            <div class="meta">由 ${esc(c.createdBy?c.createdBy.name:"未知")} 建立・${(c.soapRounds||[]).length}輪SOAP</div>
          </div>
          <button class="iconbtn" data-edit="${c.id}">✎</button>
          <button class="iconbtn del" data-del="${c.id}">🗑</button>
        </div></div>`).join("");
    }
  }else{
    if(!trainees.length){
      html+=`<div class="empty"><div class="big">還沒有學員紀錄</div>新進治療師開始使用後會顯示在這裡。</div>`;
    }else{
      html+=trainees.slice().sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant")).map(tr=>{
        const tCases=cases.filter(c=>c.createdBy&&c.createdBy.id===tr.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
        const expanded = adminExpand===tr.id;
        let block=`<div class="card">
            <div class="row accordion" data-expand="${tr.id}">
              <div style="flex:1">
                <div class="title">${esc(tr.name)}</div>
                <div class="meta">建立 ${tCases.length} 個病例</div>
              </div>
              <div class="mini">${expanded?"▲":"▼"}</div>
            </div>`;
        if(expanded){
          block+= tCases.length
            ? tCases.map(c=>`<div class="statrow"><span>${esc(c.title)}</span><span class="mini">${fmtDate(c.createdAt)}</span></div>`).join("")
            : `<div class="mini" style="margin-top:8px">尚未建立病例</div>`;
        }
        block+=`</div>`;
        return block;
      }).join("");
    }
  }

  main.innerHTML=html;
  main.querySelectorAll("[data-asub]").forEach(b=>b.onclick=()=>{ adminSub=b.dataset.asub; render(); });
  document.getElementById("adminLock").onclick=()=>{ adminUnlocked=false; localStorage.removeItem(ADMIN_OK_KEY); render(); };
  const addBtn=document.getElementById("addCase");
  if(addBtn) addBtn.onclick=()=>openCaseEditor(null);
  main.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openCaseEditor(b.dataset.edit));
  main.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(confirm("確定要刪除這個病例嗎？（已作答的紀錄仍會保留）")){
      cases=cases.filter(c=>c.id!==b.dataset.del); saveCases(); render();
    }
  });
  main.querySelectorAll("[data-expand]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.expand; adminExpand = adminExpand===id ? null : id; render();
  });
}

/* ----- 病例編輯表單（學員新增／編輯自己的病例，或管理者編輯任何病例） ----- */
let editCase=null;
let quickVisitMode=false;   // true = 只顯示「新增回診紀錄」的精簡表單（不重複顯示病例標題/基本資料/舊輪次）
let quickVisitStartIndex=0; // 這次快速新增，是從第幾輪開始算新內容
function openCaseEditor(caseId, opts){
  opts = opts || {};
  quickVisitMode = !!opts.addRound;
  if(caseId){
    const src=cases.find(c=>c.id===caseId);
    if(!canEdit(src)){ alert("這不是你建立的病例，且管理後台尚未解鎖，無法編輯。"); return; }
    editCase = clone(src);
  }else{
    editCase = {id:uid(), title:"", createdBy:{id:myId,name:myName}, createdAt:Date.now(), demographics:blankDemo(), complaints:[], soapRounds:[blankRound("初次評估","",true)], discussion:""};
  }
  if(!editCase.demographics) editCase.demographics=blankDemo();
  if(!Array.isArray(editCase.complaints)) editCase.complaints=[];
  quickVisitStartIndex = editCase.soapRounds.length;
  if(opts.addRound) editCase.soapRounds.push(blankRound("","",true));
  openSheet(caseEditorHTML(!!caseId));
  bindCaseEditor(!!caseId);
  if(opts.addRound){
    const dateInput=document.querySelector(`[data-rdate="${quickVisitStartIndex}"]`);
    if(dateInput) setTimeout(()=>dateInput.focus(),200);
  }
}
/* 主訴項目清單（病例層級，各輪共用），新增病例／快速新增回診都會用到 */
function complaintsListHTML(){
  let h="";
  const labels=complaintLabels(editCase.complaints);
  orderedComplaintIndices(editCase.complaints).forEach(gi=>{
    const c=editCase.complaints[gi];
    const isSub=c.parent!=null;
    h+=`<div class="complaint-row" style="${isSub?'margin-left:24px':''}">
        <span class="numbadge" style="${isSub?'background:var(--amber)':''}">${labels[gi]}</span>
        <input data-citem="${gi}" value="${esc(c.text)}" placeholder="例如：舉手前側肩膀痛">
        <button class="iconbtn del" data-cdel="${gi}">✕</button>
      </div>`;
  });
  h+=`<button class="chip" id="cAdd" style="margin-bottom:14px">＋ 新增主訴項目</button>`;
  return h;
}
/* SOAP 輪次區塊，fromIndex 讓「快速新增回診」只顯示新加的那幾輪，不必看到舊輪次 */
function roundsSectionHTML(fromIndex){
  let h="";
  const editVisits=groupVisits(editCase.soapRounds);
  const labels=complaintLabels(editCase.complaints);
  (editCase.soapRounds||[]).forEach((r,ri)=>{
    if(ri<fromIndex) return;
    const showDateInput = ri===0 || !!r.newVisit;
    const effDate = (editVisits.find(v=>v.rounds.includes(r))||{}).date || "";
    h+=`<div class="soapedit">
        <div class="soapedit-h">
          ${showDateInput
            ? `<input data-rlabel="${ri}" value="${esc(r.label)}" placeholder="標題（選填，例如：初次評估）">`
            : `<div class="mini" style="flex:1">第 ${ri+1} 輪${r.label?`：${esc(r.label)}`:""}</div>`}
          ${(editCase.soapRounds.length>1)?`<button class="iconbtn del" data-rdel="${ri}">🗑</button>`:""}
        </div>`;
    if(showDateInput){
      h+=`<label style="margin:8px 0 3px">看診日期（選填；只有這裡要填，後面接著新增的輪次都自動算同一次回診）</label>
        <input type="date" data-rdate="${ri}" value="${esc(r.date||"")}" style="max-width:220px">`;
    }else{
      h+=`<div class="mini" data-datehint="${ri}" style="margin:4px 0 8px">📅 沿用本次回診日期${effDate?`（${esc(effDate)}）`:"（尚未填寫）"}</div>`;
    }
    h+=`<label style="margin:8px 0 3px">這一輪要處理哪些主訴？（可複選，勾選後下面會出現對應的 O/A/P；若沒有合適的項目，先到上方「主訴項目」新增）</label>`;
    if((editCase.complaints||[]).length){
      h+=`<div class="chip-row">${orderedComplaintIndices(editCase.complaints).map(gi=>{
        const c=editCase.complaints[gi];
        return `<button type="button" class="chip ${c.parent!=null?'sub':''} ${(r.complaintIdx||[]).includes(gi)?'on':''}" data-crtoggle="${ri}|${gi}">${labels[gi]} ${esc(c.text)||"（未命名）"}</button>`;
      }).join("")}</div>`;
    }else{
      h+=`<div class="mini" style="margin-bottom:8px">尚未新增主訴項目</div>`;
    }
    const topLevel=orderedComplaintIndices(editCase.complaints).filter(gi=>editCase.complaints[gi].parent==null);
    if(topLevel.length){
      h+=`<div class="mini" style="margin:6px 0 4px">治療後有新變化嗎？可新增追蹤項目：</div>
        <div class="chip-row">${topLevel.map(gi=>
          `<button type="button" class="chip" data-caddsub="${ri}|${gi}" style="border-style:dashed">＋ ${labels[gi]}-…</button>`
        ).join("")}</div>`;
    }

    const idxList=r.complaintIdx||[];
    if(idxList.length){
      orderedComplaintIndices(editCase.complaints).forEach(gi=>{
        if(!idxList.includes(gi)) return;
        const c=editCase.complaints[gi];
        const it=(r.items||{})[gi]||{o:"",a:"",p:""};
        h+=`<div class="complaintgroup">
            <div class="complaintgroup-h" data-grouplabel="${gi}"><span class="numbadge">${labels[gi]}</span><span>${esc(c.text)||"（尚未填寫主訴文字）"}</span></div>
            <label style="margin:0 0 3px">S 主觀描述</label>
            <textarea data-cs="${gi}" placeholder="病人這次怎麼說？（跟上方主訴項目共用同一段文字）">${esc(c.text)}</textarea>
            <label style="margin:8px 0 3px">O 客觀檢查</label>
            <textarea class="big" data-io="${ri}|${gi}" placeholder="站姿觀察…&#10;動作測試…&#10;觸診…">${esc(it.o)}</textarea>
            <label style="margin:8px 0 3px">A 評估／假設</label>
            <textarea class="big" data-ia="${ri}|${gi}" placeholder="臨床推理、懷疑的問題點…">${esc(it.a)}</textarea>
            <label style="margin:8px 0 3px">P 處置／計畫</label>
            <textarea class="big" data-ip="${ri}|${gi}" placeholder="治療手法、運動處方、結果…">${esc(it.p)}</textarea>
          </div>`;
      });
    }else{
      const g=r.general||{o:"",a:"",p:""};
      h+=`<label style="margin:8px 0 3px">O 客觀檢查</label>
        <textarea class="big" data-go="${ri}" placeholder="可自由書寫，例如：站姿觀察…&#10;動作測試…&#10;觸診…">${esc(g.o)}</textarea>
        <label style="margin:8px 0 3px">A 評估／假設</label>
        <textarea class="big" data-ga="${ri}" placeholder="臨床推理、懷疑的問題點…">${esc(g.a)}</textarea>
        <label style="margin:8px 0 3px">P 處置／計畫</label>
        <textarea class="big" data-gp="${ri}" placeholder="治療手法、運動處方、結果…">${esc(g.p)}</textarea>`;
    }
    h+=`</div>`;
  });
  h+=`<button class="chip wide" id="addRound" style="margin-bottom:14px">＋ 新增下一輪 SOAP</button>`;
  return h;
}
function caseEditorHTML(isEdit){
  if(quickVisitMode){
    // 快速新增回診：不重複顯示病例標題／基本資料／舊的回診內容，只填這次回診的日期跟 SOAP
    let h=`<h3>新增回診紀錄</h3>
      <div class="mini" style="margin-bottom:10px">📋 ${esc(editCase.title||"（未命名病例）")}</div>
      <div class="mini" style="margin-bottom:14px">不用重填姓名、基本資料，只要填這次回診的日期跟 SOAP 內容就好。</div>
      <label>主訴項目（可勾選之前用過的，或直接新增）</label>`;
    h+=complaintsListHTML();
    h+=roundsSectionHTML(quickVisitStartIndex);
    h+=`<div class="btns"><button class="cancel" id="ceCancel">取消</button><button class="save" id="ceSave">儲存</button></div>`;
    return h;
  }
  let h=`<h3>${isEdit?"編輯病例":"新增病例"}</h3>
    <div class="mini" style="margin-bottom:6px">用 SOAP（主觀 S／客觀 O／評估 A／處置 P）記錄病例，一輪代表一次評估或介入循環，可以無限新增輪次，每格都是自由文字，想怎麼寫都可以。</div>
    <label>病例標題</label>
    <input id="ceTitle" value="${esc(editCase.title)}" placeholder="例如：2026/08/04 明德 右側肩膀">
    <div class="soapedit" style="margin-top:14px">
      <label style="margin-top:0">基本資料（選填）</label>
      <label style="margin:10px 0 3px">姓氏</label>
      <input id="ceSurname" value="${esc(editCase.demographics.surname)}" placeholder="例如：李（會自動顯示成「李先生／李小姐」）">
      <label style="margin:10px 0 3px">性別</label>
      <div class="seg" id="ceGender">${["男","女","其他"].map(g=>`<button type="button" data-v="${g}" class="${editCase.demographics.gender===g?'on':''}">${g}</button>`).join("")}</div>
      <label>年齡</label>
      <input id="ceAge" value="${esc(editCase.demographics.age)}" placeholder="例如：35" inputmode="numeric">
      <label>職業</label>
      <input id="ceOcc" value="${esc(editCase.demographics.occupation)}" placeholder="例如：工程師">
      <label>慢性病</label>
      <div class="seg" id="ceChronic">
        <button type="button" data-v="0" class="${editCase.demographics.chronicHas?'':'on'}">無</button>
        <button type="button" data-v="1" class="${editCase.demographics.chronicHas?'on':''}">有</button>
      </div>
      ${editCase.demographics.chronicHas?`<input id="ceChronicDetail" value="${esc(editCase.demographics.chronicDetail)}" placeholder="例如：高血壓、糖尿病" style="margin-top:8px">`:""}
      <label>運動項目</label>
      <input id="ceSport" value="${esc(editCase.demographics.sport)}" placeholder="例如：路跑、重量訓練、羽球">
      <label>運動頻率</label>
      <input id="ceFreq" value="${esc(editCase.demographics.exerciseFreq)}" placeholder="例如：每週3次，每次1小時">
    </div>
    <label>主訴項目（病人的主要問題，每一輪 SOAP 可以勾選要處理哪幾項；治療後有新變化，可在下方每一輪的勾選區「新增追蹤項目」）</label>`;
  h+=complaintsListHTML();
  h+=`<label>SOAP 輪次</label>`;
  h+=roundsSectionHTML(0);
  h+=`<label>討論／反思（選填）</label>
    <textarea id="ceDiscuss" placeholder="例如：如果這個假設不成立，還有哪些可能？">${esc(editCase.discussion||"")}</textarea>`;
  h+=`<div class="btns"><button class="cancel" id="ceCancel">取消</button><button class="save" id="ceSave">儲存</button></div>`;
  if(isEdit) h+=`<button class="del" id="ceDel">刪除此病例</button>`;
  return h;
}
function refreshEditorSheet(isEdit){
  document.getElementById("sheet").innerHTML=caseEditorHTML(isEdit);
  bindCaseEditor(isEdit);
}
function bindCaseEditor(isEdit){
  if(!quickVisitMode){
    document.getElementById("ceTitle").oninput=e=>editCase.title=e.target.value;
    document.getElementById("ceDiscuss").oninput=e=>editCase.discussion=e.target.value;

    document.getElementById("ceSurname").oninput=e=>editCase.demographics.surname=e.target.value;
    document.querySelectorAll("#ceGender button").forEach(b=>b.onclick=()=>{
      editCase.demographics.gender = editCase.demographics.gender===b.dataset.v ? "" : b.dataset.v;
      refreshEditorSheet(isEdit);
    });
    document.getElementById("ceAge").oninput=e=>editCase.demographics.age=e.target.value;
    document.getElementById("ceOcc").oninput=e=>editCase.demographics.occupation=e.target.value;
    document.querySelectorAll("#ceChronic button").forEach(b=>b.onclick=()=>{
      editCase.demographics.chronicHas = b.dataset.v==="1";
      refreshEditorSheet(isEdit);
    });
    const chronicDetailEl=document.getElementById("ceChronicDetail");
    if(chronicDetailEl) chronicDetailEl.oninput=e=>editCase.demographics.chronicDetail=e.target.value;
    document.getElementById("ceSport").oninput=e=>editCase.demographics.sport=e.target.value;
    document.getElementById("ceFreq").oninput=e=>editCase.demographics.exerciseFreq=e.target.value;
  }

  function autoGrow(el){ el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
  document.querySelectorAll("[data-rlabel]").forEach(inp=>inp.oninput=e=>{ editCase.soapRounds[+inp.dataset.rlabel].label=e.target.value; });
  document.querySelectorAll("[data-rdate]").forEach(inp=>inp.oninput=e=>{
    editCase.soapRounds[+inp.dataset.rdate].date=e.target.value;
    const visits=groupVisits(editCase.soapRounds);
    editCase.soapRounds.forEach((r,i)=>{
      const hint=document.querySelector(`[data-datehint="${i}"]`);
      if(!hint) return;
      const v=visits.find(v=>v.rounds.includes(r));
      const d=v?v.date:"";
      hint.textContent = "📅 沿用本次回診日期"+(d?`（${d}）`:"（尚未填寫）");
    });
  });
  document.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=()=>{
    if(editCase.soapRounds.length<=1){ alert("至少要保留一輪 SOAP"); return; }
    editCase.soapRounds.splice(+b.dataset.rdel,1); refreshEditorSheet(isEdit);
  });
  document.getElementById("addRound").onclick=()=>{
    editCase.soapRounds.push(blankRound("", "", false));
    refreshEditorSheet(isEdit);
  };

  // 每個「這一輪有勾選的主訴」各自一組 O/A/P
  document.querySelectorAll("[data-io]").forEach(t=>{ autoGrow(t); t.oninput=e=>{ const [ri,gi]=t.dataset.io.split("|"); editCase.soapRounds[+ri].items[+gi].o=e.target.value; autoGrow(t); }; });
  document.querySelectorAll("[data-ia]").forEach(t=>{ autoGrow(t); t.oninput=e=>{ const [ri,gi]=t.dataset.ia.split("|"); editCase.soapRounds[+ri].items[+gi].a=e.target.value; autoGrow(t); }; });
  document.querySelectorAll("[data-ip]").forEach(t=>{ autoGrow(t); t.oninput=e=>{ const [ri,gi]=t.dataset.ip.split("|"); editCase.soapRounds[+ri].items[+gi].p=e.target.value; autoGrow(t); }; });
  // 這一輪沒有勾選任何主訴時，共用一組 O/A/P
  document.querySelectorAll("[data-go]").forEach(t=>{ autoGrow(t); t.oninput=e=>{ editCase.soapRounds[+t.dataset.go].general.o=e.target.value; autoGrow(t); }; });
  document.querySelectorAll("[data-ga]").forEach(t=>{ autoGrow(t); t.oninput=e=>{ editCase.soapRounds[+t.dataset.ga].general.a=e.target.value; autoGrow(t); }; });
  document.querySelectorAll("[data-gp]").forEach(t=>{ autoGrow(t); t.oninput=e=>{ editCase.soapRounds[+t.dataset.gp].general.p=e.target.value; autoGrow(t); }; });

  // 主訴項目（病例層級，各輪共用；可有子項目記錄治療後的追蹤變化）
  // 同一個主訴的文字可能同時出現在上方主訴清單、以及每一輪各自的 S 欄位（可能不只一處），
  // 三處都指向同一份資料，任何一處改了都要同步更新其他地方的顯示。
  function syncComplaintText(gi,value){
    editCase.complaints[gi].text=value;
    document.querySelectorAll(`[data-citem="${gi}"]`).forEach(el=>{ if(el.value!==value) el.value=value; });
    document.querySelectorAll(`[data-cs="${gi}"]`).forEach(el=>{ if(el.value!==value) el.value=value; });
    document.querySelectorAll(`[data-grouplabel="${gi}"] span:last-child`).forEach(el=>{
      el.textContent = value || "（尚未填寫主訴文字）";
    });
  }
  document.querySelectorAll("[data-citem]").forEach(inp=>inp.oninput=e=>syncComplaintText(+inp.dataset.citem, e.target.value));
  document.querySelectorAll("[data-cs]").forEach(ta=>ta.oninput=e=>syncComplaintText(+ta.dataset.cs, e.target.value));
  document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{
    const gi=+b.dataset.cdel;
    const children=editCase.complaints.map((c,i)=>c.parent===gi?i:-1).filter(i=>i>=0);
    if(children.length && !confirm(`這個主訴底下有 ${children.length} 個追蹤子項目，會一併刪除，確定嗎？`)) return;
    const toDelete=new Set([gi, ...children]);
    const remap={}; let newIdx=0;
    editCase.complaints.forEach((c,i)=>{ remap[i]=toDelete.has(i)?-1:newIdx++; });
    editCase.complaints = editCase.complaints
      .filter((c,i)=>!toDelete.has(i))
      .map(c=>({text:c.text, parent:(c.parent==null||remap[c.parent]===-1)?null:remap[c.parent]}));
    editCase.soapRounds.forEach(r=>{
      r.complaintIdx = (r.complaintIdx||[]).filter(i=>remap[i]!==-1).map(i=>remap[i]);
      const newItems={};
      Object.keys(r.items||{}).forEach(k=>{
        const ki=+k;
        if(remap[ki]===-1) return;
        newItems[remap[ki]]=r.items[k];
      });
      r.items=newItems;
    });
    refreshEditorSheet(isEdit);
  });
  document.getElementById("cAdd").onclick=()=>{
    editCase.complaints.push({text:"", parent:null});
    refreshEditorSheet(isEdit);
  };

  // 每一輪勾選要處理哪些主訴
  document.querySelectorAll("[data-crtoggle]").forEach(b=>b.onclick=()=>{
    const [ri,gi]=b.dataset.crtoggle.split("|").map(Number);
    const r=editCase.soapRounds[ri];
    if(!r.complaintIdx) r.complaintIdx=[];
    if(!r.items) r.items={};
    const pos=r.complaintIdx.indexOf(gi);
    if(pos>=0) r.complaintIdx.splice(pos,1);
    else{ r.complaintIdx.push(gi); if(!r.items[gi]) r.items[gi]={o:"",a:"",p:""}; }
    refreshEditorSheet(isEdit);
  });
  // 治療後新增追蹤子項目，並自動勾選進這一輪
  document.querySelectorAll("[data-caddsub]").forEach(b=>b.onclick=()=>{
    const [ri,parentGi]=b.dataset.caddsub.split("|").map(Number);
    editCase.complaints.push({text:"", parent:parentGi});
    const newGi=editCase.complaints.length-1;
    const r=editCase.soapRounds[ri];
    if(!r.complaintIdx) r.complaintIdx=[];
    if(!r.items) r.items={};
    r.complaintIdx.push(newGi);
    r.items[newGi]={o:"",a:"",p:""};
    refreshEditorSheet(isEdit);
  });

  document.getElementById("ceCancel").onclick=closeSheet;
  document.getElementById("ceSave").onclick=()=>{
    if(!editCase.title.trim()){ alert("請輸入病例標題"); return; }
    if(!editCase.soapRounds.length){ alert("請至少保留一輪 SOAP"); return; }
    const idx=cases.findIndex(c=>c.id===editCase.id);
    if(idx>=0) cases[idx]=editCase; else cases.push(editCase);
    saveCases(); closeSheet(); render();
  };
  const delBtn=document.getElementById("ceDel");
  if(delBtn) delBtn.onclick=()=>{
    if(confirm("確定要刪除這個病例嗎？（已作答的紀錄仍會保留）")){
      cases=cases.filter(c=>c.id!==editCase.id); saveCases(); closeSheet(); render();
    }
  };
}

/* ===== 啟動 ===== */
ensureIdentity();
render();
cloudInit();
</script>
</body>
</html>
